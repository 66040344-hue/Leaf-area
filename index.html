<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รอเปิดตัว - 31 สิงหาคมนี้</title>
    <meta name="description" content="ยินดีต้อนรับ เราจะได้พบกัน 31 สิงหาคมนี้ รอเปิดตัว">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000d1e;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; /* Prevent scrollbars */
        }
        .coming-soon-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .coming-soon-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain; /* Scale image down to fit while maintaining aspect ratio */
        }
    </style>
</head>
<body>
    <div class="coming-soon-container">
        <img src="Soon.png" alt="รอเปิดตัว 31 สิงหาคมนี้">
    </div>
</body>
</html>
